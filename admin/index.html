<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameStore Admin — Inicio</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__marca">GameStore <span style="color:var(--color-text-muted); font-weight:400; font-size:0.8rem;">/ admin</span></div>
      <nav>
        <a href="index.html" class="activo">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="usuarios.html" id="link-usuarios">Usuarios</a>
        <a href="../index.html" style="margin-top:20px; border-top:1px solid var(--color-border); padding-top:16px; display:block;">Volver a la tienda</a>
      </nav>
      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--color-border); font-size:0.82rem;">
        <div id="admin-usuario-nombre" style="color:var(--color-text-muted); margin-bottom:8px;"></div>
        <a href="#" id="admin-cerrar-sesion">Cerrar sesión</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-encabezado">
        <h1 id="titulo-bienvenida">¡Hola!</h1>
      </div>
      <p>Desde aquí gestionas el catálogo de juegos y las cuentas de usuario. El diseño de esta sección es libre — esto es solo un punto de partida con el menú ya funcionando.</p>

      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:20px; margin-top:32px;">
        <div class="tabla-wrap" style="padding:24px;">
          <div style="color:var(--color-text-muted); font-size:0.85rem;">Productos</div>
          <div style="font-family:var(--font-display); font-size:2rem; font-weight:700;" id="resumen-productos">—</div>
        </div>
        <div class="tabla-wrap" style="padding:24px;">
          <div style="color:var(--color-text-muted); font-size:0.85rem;">Stock crítico</div>
          <div style="font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--color-accent);" id="resumen-critico">—</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/productos-data.js"></script>
  <script src="../js/sesion.js"></script>
  <script>
    const sesion = protegerAdmin(['administrador', 'vendedor'], '../');
    if (sesion) {
      ajustarSidebarSegunRol(sesion);
      document.getElementById('titulo-bienvenida').textContent = `¡Hola, ${sesion.nombre}!`;
      document.getElementById('resumen-productos').textContent = PRODUCTOS.length;
      document.getElementById('resumen-critico').textContent = PRODUCTOS.filter(p => p.stock <= p.stockCritico).length;
    }
  </script>
</body>
</html>
